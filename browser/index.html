<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Proctor - Face Presence Monitor (Step 1)</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 12px; }
    #video { transform: scaleX(-1); } /* mirror for user */
    #canvas { display: none; } /* used for snapshot only */
    #status { margin-top: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <h3>Face Presence Monitor (Step 1)</h3>
  <video id="video" autoplay playsinline width="640" height="480"></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="status">Loading…</div>

  <!-- TF + BlazeFace -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@latest"></script>

  <script type="module">
    import { startFacePresenceMonitor } from './face_monitor.js';
    startFacePresenceMonitor({
      videoEl: document.getElementById('video'),
      canvasEl: document.getElementById('canvas'),
      statusEl: document.getElementById('status'),
      backendEndpoint: '/api/incident' // your server receiver
    });
  </script>
</body>
</html>
