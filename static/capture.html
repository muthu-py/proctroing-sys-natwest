<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Capture 4+ Photos & Upload</title>
  <style>
    body { font-family: Inter, system-ui, -apple-system, sans-serif; margin: 20px; color:#111 }
    .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    video { width: 480px; height: 360px; background:#000; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.08) }
    .controls { display:flex; gap:8px; flex-direction:column; }
    button { padding:10px 14px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer }
    button.primary { background:#0b63d6; color:#fff; border-color:transparent }
    button:disabled { opacity:.5; cursor:not-allowed }
    .thumbs { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap }
    .thumb { width:110px; height:82px; object-fit:cover; border-radius:6px; border:1px solid #eee; }
    .meta { margin-top:8px; color:#444; font-size:0.95rem }
    .counter { font-weight:700 }
    .hint { color:#666; font-size:.9rem }
  </style>
</head>
<body>
  <h2>Take 4+ Photos & Send to Backend</h2>

  <div class="row">
    <video id="video" autoplay playsinline></video>

    <div class="controls">
      <div>
        <button id="snapBtn">Take Photo</button>
        <button id="resetBtn">Reset</button>
      </div>

      <div style="margin-top:6px;">
        <button id="uploadBtn" class="primary" disabled>Upload (min 4)</button>
      </div>

      <div class="meta">
        <div class="hint">Photos taken: <span id="count" class="counter">0</span></div>
        <div class="hint">Minimum required: <strong>4</strong></div>
        <div style="margin-top:8px;color:#666;font-size:.88rem;">
          Upload endpoint: <code>/upload</code> (POST, multipart/form-data)
        </div>
      </div>
    </div>
  </div>

  <div class="thumbs" id="thumbs"></div>

  <!-- hidden canvas to capture frames -->
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    (function(){
      const video = document.getElementById('video');
      const snapBtn = document.getElementById('snapBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const resetBtn = document.getElementById('resetBtn');
      const thumbs = document.getElementById('thumbs');
      const captureCanvas = document.getElementById('captureCanvas');
      const countEl = document.getElementById('count');

      const MIN_PHOTOS = 4;
      const photos = []; // {blob, filename, dataUrl}

      // Start webcam
      async function initCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
          });
          video.srcObject = stream;
          await video.play();
        } catch (err) {
          alert('Could not access camera: ' + err.message);
          console.error(err);
        }
      }

      // Capture frame -> Blob (jpeg)
      function captureFrame() {
        const w = video.videoWidth || 640;
        const h = video.videoHeight || 480;
        captureCanvas.width = w;
        captureCanvas.height = h;
        const ctx = captureCanvas.getContext('2d');
        // Optionally flip horizontally for selfie-like behavior:
        // ctx.translate(w, 0); ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);

        return new Promise(resolve => {
          captureCanvas.toBlob(blob => {
            resolve(blob);
          }, 'image/jpeg', 0.85); // quality
        });
      }

      function updateUI() {
        thumbs.innerHTML = '';
        photos.forEach((p, i) => {
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = p.dataUrl;
          img.title = p.filename;
          thumbs.appendChild(img);
        });
        countEl.textContent = photos.length;
        uploadBtn.disabled = photos.length < MIN_PHOTOS;
      }

      snapBtn.addEventListener('click', async () => {
        snapBtn.disabled = true;
        try {
          const blob = await captureFrame();
          const filename = `photo_${Date.now()}.jpg`;
          // create data URL for preview
          const reader = new FileReader();
          reader.onload = () => {
            photos.push({ blob, filename, dataUrl: reader.result });
            updateUI();
          };
          reader.readAsDataURL(blob);
        } catch (err) {
          console.error('capture error', err);
        } finally {
          snapBtn.disabled = false;
        }
      });

      resetBtn.addEventListener('click', () => {
        photos.length = 0;
        updateUI();
      });

      // Upload handler: sends to /upload as multipart/form-data
      uploadBtn.addEventListener('click', async () => {
        if (photos.length < MIN_PHOTOS) {
          alert(`Please take at least ${MIN_PHOTOS} photos.`);
          return;
        }

        uploadBtn.disabled = true;
        uploadBtn.textContent = 'Uploading…';

        const form = new FormData();
        // Append each photo as 'photos' array
        photos.forEach((p, idx) => {
          form.append('photos', p.blob, p.filename); // backend should accept multiple files under 'photos'
        });

        // Add any metadata if needed:
        form.append('ts', new Date().toISOString());
        form.append('device', navigator.userAgent);

        try {
          const res = await fetch('/upload', {
            method: 'POST',
            body: form,
          });

          if (!res.ok) {
            const text = await res.text();
            throw new Error('Upload failed: ' + res.status + ' ' + text);
          }

          const json = await res.json().catch(() => null);
          console.log('Upload successful', json);
          alert('Upload successful! Redirecting to face detection...');
          
          // Redirect to main page after successful upload
          setTimeout(() => {
            window.location.href = '/';
          }, 1500);
        } catch (err) {
          console.error(err);
          alert('Upload error: ' + err.message);
        } finally {
          uploadBtn.disabled = photos.length < MIN_PHOTOS;
          uploadBtn.textContent = photos.length >= MIN_PHOTOS ? `Upload (${photos.length})` : 'Upload (min 4)';
        }
      });

      // initialize camera on load
      initCamera();
    })();
  </script>
</body>
</html>
