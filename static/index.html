<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Webcam & Speech Detection</title>
</head>
<body>
  <h1>Webcam & Speech Detection</h1>

  <!-- Webcam Section -->
  <section>
    <h2>Webcam Capture with Face Detection</h2>
    <div style="margin-bottom: 10px;">
      <button id="resetBtn" style="padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Reset Photos & Start Over
      </button>
    </div>
    <video id="video" width="640" height="480" autoplay></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="videoStatus">Initializing...</div>
  </section>

  <hr>

  <!-- Speech Section -->
  <section>
    <h2>Live Speech Detection</h2>
    <p id="audioStatus">Initializing microphone...</p>
    <pre id="result"></pre>
  </section>

  <script>
    /* ------------------- Webcam + Face Detection ------------------- */
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const videoStatus = document.getElementById('videoStatus');
    const resetBtn = document.getElementById('resetBtn');
    let websocket = null;
    let isStreaming = false;

    function initWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;

      websocket = new WebSocket(wsUrl);

      websocket.onopen = function() {
        videoStatus.textContent = 'Connected to server';
      };

      websocket.onmessage = function(event) {
        const response = JSON.parse(event.data);
        updateStatus(response);
      };

      websocket.onclose = function() {
        videoStatus.textContent = 'Disconnected from server';
      };

      websocket.onerror = function() {
        videoStatus.textContent = 'WebSocket error occurred';
      };
    }

    function updateStatus(response) {
      const faceCount = response.face_count;
      const flag = response.flag;

      if (flag) {
        videoStatus.innerHTML = `Alert: ${flag.event}<br>Face count: ${faceCount}<br>Time: ${new Date(flag.timestamp).toLocaleTimeString()}`;
      } else {
        videoStatus.innerHTML = `Normal: ${faceCount} face(s) detected`;
      }
    }

    function captureAndSend() {
      if (!websocket || websocket.readyState !== WebSocket.OPEN) return;

      const ctx = canvas.getContext('2d');
      const width = video.videoWidth;
      const height = video.videoHeight;

      if (width === 0 || height === 0) return;

      canvas.width = width;
      canvas.height = height;

      ctx.save();
      ctx.translate(width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, width, height);
      ctx.restore();

      const imageData = canvas.toDataURL('image/jpeg', 0.8);
      const base64Data = imageData.split(',')[1];

      websocket.send(JSON.stringify({
        image: base64Data,
        timestamp: new Date().toISOString()
      }));
    }

    // Camera setup
    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    })
    .then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        videoStatus.textContent = 'Camera ready, connecting to server...';
        initWebSocket();

        setInterval(() => {
          if (isStreaming) captureAndSend();
        }, 500);
      };

      video.onplay = () => {
        isStreaming = true;
        videoStatus.textContent = 'Streaming started';
      };
    })
    .catch(err => {
      videoStatus.textContent = 'Error accessing webcam: ' + err.message;
    });

    resetBtn.addEventListener('click', async () => {
      if (confirm('Are you sure you want to reset and start over?')) {
        try {
          const response = await fetch('/reset', { method: 'POST' });
          const result = await response.json();
          if (result.success) {
            window.location.href = '/capture';
          } else {
            alert('Failed to reset photos');
          }
        } catch (error) {
          alert('Error resetting photos');
        }
      }
    });

    window.addEventListener('beforeunload', () => {
      if (websocket) websocket.close();
    });

    /* ------------------- Live Speech Detection ------------------- */
    const audioStatus = document.getElementById("audioStatus");
    const resultEl = document.getElementById("result");

    let mediaRecorder;
    let chunks = [];
    const CHUNK_DURATION = 5000;

    async function initMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioStatus.textContent = "Microphone access granted, streaming...";

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          if (chunks.length === 0) return;

          const audioBlob = new Blob(chunks, { type: "audio/webm" });
          chunks = [];

          const formData = new FormData();
          formData.append("file", audioBlob, "chunk.webm");

          try {
            const res = await fetch("http://localhost:8000/upload_audio", {
              method: "POST",
              body: formData,
            });
            const data = await res.json();
            resultEl.textContent = JSON.stringify(data, null, 2);
          } catch {
            resultEl.textContent = "Error uploading chunk.";
          }

          mediaRecorder.start();
          setTimeout(() => mediaRecorder.stop(), CHUNK_DURATION);
        };

        // Start first cycle
        mediaRecorder.start();
        setTimeout(() => mediaRecorder.stop(), CHUNK_DURATION);

      } catch (err) {
        audioStatus.textContent = "Could not access microphone: " + err.message;
      }
    }

    // auto-run mic on page load
    window.onload = initMicrophone;
  </script>
</body>
</html>
